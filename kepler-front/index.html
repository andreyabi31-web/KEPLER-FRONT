{n:'Sektor 3: Dataran Es',c:'Hukum Newton, FBD, gesekan',pos:[-20,-190],w:[['drone',2],['walker',5]],s:'Di es koefisien gesek μ anjlok, sehingga traksi maksimum hanya a = μg. Bayangkan FBD tubuhmu: berat W, gaya normal N, dorongan kaki, dan gesekan f = μN.',q:['Benda 5 kg di lantai datar (g = 10 m/s²) dengan μ = 0,2. Berapa gaya gesek kinetiknya?',['10 N','50 N','1 N'],0,'N = mg = 50 N, maka f = μN = 0,2·50 = 10 N.']},
{n:'Sektor 4: Stasiun Kepler',c:'Gravitasi dan hukum Kepler',pos:[-110,-120],w:[['drone',6],['walker',3],['sniper',1]],s:'Satelit Kepler-1 mengorbit di atas. Tekan Q untuk serangan orbital. Pengisian ulangnya sama dengan periode orbit T, dan T² sebanding dengan r³.',q:['Jari-jari orbit menjadi 4 kali lebih besar. Periode orbit menjadi?',['4 kali','8 kali','16 kali'],1,'T² ∝ r³ sehingga T ∝ r^1,5 = 4^1,5 = 8 kali.']},
{n:'Sektor 5: Lembah Parabola',c:'Kinematika dan gerak parabola (Bab 2 dan 3)',pos:[-170,-40],w:[['drone',5],['walker',5]],s:'Peluru dan granat bergerak parabola: komponen horizontal konstan, komponen vertikal dipercepat oleh g. Gunakan v = v₀ + at dan x = v₀t + ½at² untuk menaksir titik jatuh.',q:['Bola dilempar mendatar dari ketinggian 20 m (g = 10 m/s²). Berapa waktu jatuhnya?',['1 s','2 s','4 s'],1,'t = √(2h/g) = √4 = 2 s.']},
{n:'Sektor 6: Menara Vektor',c:'Vektor dan komponen (Bab 3)',pos:[120,-30],w:[['walker',7],['drone',4],['sniper',1]],s:'Kecepatan adalah vektor, jadi arah penting. Panel menampilkan komponen vx dan vz. Dua vektor tegak lurus dijumlahkan dengan teorema Pythagoras.',q:['Kamu bergerak 3 m/s ke timur dan 4 m/s ke utara. Berapa besar kecepatan resultannya?',['5 m/s','7 m/s','1 m/s'],0,'v = √(3² + 4²) = 5 m/s.']},
{n:'Sektor 7: Benteng Newton',c:'Hukum Newton I sampai III (Bab 4)',pos:[190,-190],w:[['drone',8],['walker',6]],s:'Tembakan mendorongmu mundur karena gaya aksi–reaksi (hukum III). Rover 1200 kg dipercepat oleh ΣF = ma, dan di es traksinya hilang.',q:['Senapan mendorong peluru ke depan dengan gaya 100 N. Gaya yang bekerja pada senapan?',['0 N','100 N ke belakang','100 N ke depan'],1,'Hukum III Newton: gaya reaksi sama besar dan berlawanan arah.']},
{n:'Sektor 8: Tikungan Sirkular',c:'Gerak melingkar dan gravitasi (Bab 5)',pos:[240,-60],w:[['drone',4],['walker',6],['sniper',1]],s:'Benda yang bergerak melingkar butuh gaya sentripetal Fc = mv²/r yang menuju pusat lingkaran. Tidak ada gaya sentrifugal: jika gesekan tidak cukup, rover meluncur lurus menurut garis singgung. Satelit pun terus jatuh mengelilingi planet, dan penumpangnya melayang karena gaya normal nol.',q:['Mobil 1000 kg menikung di jalan datar berjari-jari 50 m dengan laju 10 m/s. Berapa gaya sentripetalnya?',['200 N','2000 N','20000 N'],1,'Fc = mv²/r = 1000·10²/50 = 2000 N.']},
{n:'Sektor 9: Lembah Pegas',c:'Usaha, energi, dan daya (Bab 6)',pos:[200,90],w:[['walker',6],['drone',6]],s:'Pad pegas menyimpan energi potensial ½kx² lalu mengubahnya menjadi energi kinetik. Tanpa gesekan, energi mekanik KE + PE tetap. Gesekan mengubahnya menjadi panas, dan daya adalah laju usaha, P = W/t = Fv.',q:['Pegas dengan k = 200 N/m ditekan 0,1 m. Berapa energi potensial pegas?',['1 J','10 J','20 J'],0,'PE = ½kx² = ½·200·0,1² = 1 J.']},
{n:'Sektor 10: Zona Tumbukan',c:'Momentum linear dan tumbukan (Bab 7)',pos:[-150,60],w:[['walker',8],['drone',4],['sniper',2]],s:'Momentum p = mv kekal saat tumbukan. Pada tumbukan lenting energi kinetik juga kekal, sedangkan pada tumbukan tak lenting sebagian berubah menjadi panas. Bila benda menyatu, hanya ada satu kecepatan akhir. Tabrak infanteri dengan rover dan baca panel TUMBUKAN.',q:['Mobil 1000 kg melaju 10 m/s menabrak mobil 1000 kg yang diam, lalu keduanya menyatu. Berapa laju sesudahnya?',['5 m/s','10 m/s','20 m/s'],0,'m₁v₁ = (m₁+m₂)v′, sehingga v′ = 10000/2000 = 5 m/s.']},
{n:'Sektor 11: Sarang Titan',c:'Semua konsep',pos:[0,-290],w:[['boss',1],['drone',4],['walker',2],['sniper',2]],s:'Inti Titan. Nyalakan Night Vision (V) untuk melacak kecepatan musuh, dan bidik dengan memperhitungkan jatuhnya peluru: y = y₀ + v₀t − ½gt².',q:['Pada sudut berapa jangkauan tembakan maksimum (tanpa hambatan udara)?',['30°','45°','60°'],1,'R = v²sin2θ/g maksimum saat sin2θ = 1, yaitu θ = 45°.']}];

const sd=(a,b,c)=>{const ab=b.clone().sub(a),t=Math.max(0,Math.min(1,c.clone().sub(a).dot(ab)/(ab.lengthSq()||1)));return a.clone().addScaledVector(ab,t).distanceTo(c)};

['Bab 1: Pengukuran dan satuan SI','Materi: satuan SI, konversi satuan, angka penting, estimasi.','Di game: semua angka di HUD memakai satuan SI (m, s, kg, N, J). Massa Exo-Suit 80 kg, rover 1200 kg, g = 9,81 m/s².'],
['Bab 2: Kinematika satu dimensi','Materi: v = Δx/Δt, a = Δv/Δt, v = v₀ + at, x = v₀t + ½at², jatuh bebas.','Di game: panel KINEMATIKA menampilkan v dan a. Lompat dan jetpack memakai persamaan gerak lurus berubah beraturan. Peti suplai jatuh dengan parasut sampai kecepatan akhir tetap (Sektor 5).'],
['Bab 3: Vektor dan gerak dua dimensi','Materi: komponen vektor, resultan, gerak parabola, penjumlahan kecepatan.','Di game: panel menampilkan komponen vx dan vz. Peluru dan granat bergerak parabola, jadi senjata di-zeroing (diarahkan sedikit ke atas) agar jatuh tepat di crosshair. Hujan meteor juga jatuh bebas (Sektor 5 dan 6).'],
['Bab 4: Hukum Newton dan gaya','Materi: hukum I, II, III, berat, gaya normal, gesekan, diagram benda bebas (FBD).','Di game: di zona es traksi dibatasi a ≤ μg, jadi kamu dan rover meluncur (hukum I). Percepatan a = ΣF/m untuk rover dan jetpack (T − mg = ma). Tembakan mendorongmu mundur (hukum III). Panel FBD menampilkan W, N, dan f = μN (Sektor 3 dan 7).'],

['Bab 6: Usaha dan energi','Materi: usaha W = Fd cos θ, teorema usaha–energi, energi potensial gravitasi dan pegas, kekekalan energi mekanik, gaya disipatif, daya P = W/t.','Di game: panel ENERGI menampilkan KE, PE = mgh, dan energi mekanik Em. Pad pegas hijau mengubah ½kx² menjadi KE. Gesekan mengubah energi menjadi panas (Q gesek) saat kamu mengerem atau meluncur, dan panel DAYA menampilkan P = F·v, jarak henti rover v²/2μg, dan gaya dorong roket jetpack T = ve·dm/dt. Sektor 9.'],
['Bab 7: Momentum linear dan tumbukan','Materi: p = mv, F = Δp/Δt, kekekalan momentum, impuls, tumbukan lenting dan tak lenting, pusat massa.','Di game: peluru dan granat memberi impuls J = Δp pada musuh, dan panel IMPAK menampilkan gaya rata-rata J/Δt. Rover yang menabrak infanteri menghasilkan tumbukan tak lenting, dan panel TUMBUKAN menampilkan laju akhir serta energi yang hilang. Granat memantul dengan restitusi, lalu meledak menjadi 8 serpihan yang pusat massanya tetap mengikuti lintasan granat (panel PUSAT MASSA). Rover yang menabrak dinding menunjukkan restitusi e. Sektor 10.'],
['Proyek JOULE: usaha dan energi','Materi: W = F·s, energi kinetik ½mv², teorema usaha–energi.','Di game: daya rusak peluru adalah energi kinetiknya, jadi railgun yang cepat dan berat jauh lebih mematikan. Sprint dan jetpack menguras bar energi. Peluru energi tinggi di toko menambah energi kinetik (Sektor 1).'],
['Proyek IMPULSE: momentum dan impuls','Materi: p = mv, J = FΔt = Δp, tumbukan, koefisien restitusi.','Di game: peluru dan ledakan granat mendorong musuh sebesar Δv = J/m. Granat memantul dengan restitusi e. Rover yang menabrak infanteri memindahkan momentum (Sektor 2).'],
['Proyek ORBITAL: gravitasi dan hukum Kepler','Materi: gravitasi, orbit melingkar, T² ∝ r³.','Di game: satelit Kepler-1 mengorbit di langit. Serangan orbital (Q) terisi ulang selama satu periode orbit T (Sektor 4).'],
['Proyek robotika: FBD robot beroda','Materi: gaya dorong motor, gesekan, gaya normal, ΣF = ma pada robot.','Di game: rover adalah robot beroda dengan gaya mesin melawan gesekan, dan drone pendamping KAI-7 adalah robot otonom yang mencari dan menembak musuh. Dasarnya adalah simulasi FBD robot.'],
['Proyek computer vision: Night Vision (tekan V)','Materi: deteksi warna (HSV), kotak pembatas, pelacakan objek antar-frame, filter EMA.','Di game: layar berubah menjadi tampilan night vision hijau. Musuh dideteksi lewat warnanya (drone MERAH, infanteri HIJAU, Titan BIRU) dan diberi kotak. Kecepatan, momentum, dan energi kinetik tiap musuh dihitung dari posisinya antar-frame dengan filter α = 0,25, lengkap dengan grafik v–t dan peringatan tabrakan.']];

">Layar penuh</button></div><div class="gr"><div><b>Cara main online (maks 4 orang)</b>1) Bagikan artifact ini ke temanmu lewat menu Share, dan mereka harus masuk akun claude.ai. 2) Semua membuka link yang sama. 3) Semua mengetik kode room yang sama dan callsign masing-masing. 4) Klik Main online.</div><div><b>Apa itu kode room?</b>Bukan kode rahasia atau angka dari sistem. Itu nama ruang yang kamu karang sendiri, misalnya kelompok7 (huruf kecil, angka, titik, atau strip). Pemain dengan kode yang sama bertemu di dunia yang sama. Kode berbeda berarti ruang berbeda.</div><div><b>Tanpa akun atau tombol Share</b>Unduh file game (Export), lalu semua teman membukanya di Chrome atau Edge. Isi kode room yang sama dan klik Main online. Koneksi langsung antar-browser (WebRTC). Orang yang masuk pertama menjadi penghubung dan tidak boleh keluar sebelum yang lain selesai.</div></div><h2 style="margin-top:22px">Peta konsep fisika: di mana materinya di dalam game</h2><div class="gr">${cmH}</div></div>`;
